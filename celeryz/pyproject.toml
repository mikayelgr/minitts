[project]
name = "celeryz"
version = "0.1.0"
# description = "Add your description here"
# readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.2",
    "celery[redis]>=5.6.3",
    "core",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "types-boto3[essential]>=1.43.2",
    "url-normalize>=3.0.0",
]

[tool.uv.sources]
core = { path = "../core", editable = true }

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
